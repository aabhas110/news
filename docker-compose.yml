services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: newsforge
      POSTGRES_PASSWORD: newsforge
      POSTGRES_DB: newsforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsforge -d newsforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://newsforge:newsforge@postgres:5432/newsforge?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-docker-secret-change-me
      CRON_SECRET: local-cron-secret
      AI_DISABLED: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
